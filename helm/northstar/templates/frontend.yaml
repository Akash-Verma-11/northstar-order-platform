apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ include "northstar.fullname" . }}-frontend}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector: {matchLabels: {app: northstar-frontend}}
  template:
    metadata: {labels: {app: northstar-frontend}}
    spec:
      containers:
      - name: frontend
        image: "{{ .Values.frontend.image }}:{{ .Values.frontend.tag }}"
        ports: [{containerPort: 80}]
      resources:
        {{- toYaml .Values.frontend.resources | nindent 10 }}
      readinessProbe:
        httpGet: {path: /, port: 80}
        periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: {name: northstar-frontend}
spec:
  selector: {app: northstar-frontend}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: northstar
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: northstar-frontend, port: {number: 80}}}
