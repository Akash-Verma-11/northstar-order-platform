apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: northstar}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
      - name: frontend
        image: northstar-order-platform-frontend:latest
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 80}]
        startupProbe:
          httpGet: {path: /, port: 80}
          periodSeconds: 5
          failureThreshold: 10
        readinessProbe:
          httpGet: {path: /, port: 80}
          periodSeconds: 5
          timeoutSeconds: 3
        resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: northstar}
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 80}]
---

