{{- if not .Values.postgres.host }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.postgres.storageSize }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
      - name: postgres
        image: "{{ .Values.postgres.image }}:{{ .Values.postgres.tag }}"
        ports: [{containerPort: 5432}]
        env:
        - {name: POSTGRES_DB, value: {{ .Values.postgres.dbName | quote }}}
        - {name: POSTGRES_USER, value: {{ .Values.postgres.user | quote }}}
        - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: order-db-secret, key: password}}}
        - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
        volumeMounts:
        - {name: postgres-storage, mountPath: /var/lib/postgresql/data}
        startupProbe:
          exec: {command: ["pg_isready","-U","{{ .Values.postgres.user }}","-d","{{ .Values.postgres.dbName }}"]}
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          exec: {command: ["pg_isready","-U","{{ .Values.postgres.user }}","-d","{{ .Values.postgres.dbName }}"]}
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          exec: {command: ["pg_isready","-U","{{ .Values.postgres.user }}","-d","{{ .Values.postgres.dbName }}"]}
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 4
        resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
      volumes:
      - name: postgres-storage
        persistentVolumeClaim: {claimName: postgres-pvc}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
spec:
  selector: {app: postgres}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
{{- end }}