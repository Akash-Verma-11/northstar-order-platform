services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U app -d orders"]
      interval: 5s
      timeout: 5s
      retries: 20
  order-api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/orders
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL","python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    build: ./worker
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/orders
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [order-api]
volumes:
  pgdata:
