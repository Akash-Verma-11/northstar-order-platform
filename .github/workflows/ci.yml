name: CI-CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-scan-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: "3.12"}

    - name: Backend tests
      run: |
        python -m pip install -r backend/requirements.txt pytest
        PYTHONPATH=backend pytest -q backend/tests

    - name: SonarQube
      uses: SonarSource/sonarqube-scan-action@v6
      continue-on-error: true
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    # FIXED: Added v prefix and updated to latest secure version
    - name: Trivy filesystem scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: fs
        scan-ref: .
        severity: CRITICAL,HIGH
        exit-code: "1"

    - name: Build images
      run: |
        docker build -t northstar-api:${{ github.sha }} backend
        docker build -t northstar-worker:${{ github.sha }} worker
        docker build -t northstar-frontend:${{ github.sha }} frontend

    # FIXED: Added v prefix and updated to latest secure version
    - name: Trivy image scan
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: northstar-api:${{ github.sha }}
        severity: CRITICAL,HIGH
        exit-code: "1"

    - name: Log in to GHCR
      if: github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Tag and push images
      if: github.ref == 'refs/heads/main'
      run: |
        for svc in api worker frontend; do
          docker tag northstar-$svc:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/northstar-$svc:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/northstar-$svc:${{ github.sha }}
        done

    - name: Update Helm values with new image tags
      if: github.ref == 'refs/heads/main'
      run: |
        sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq

        yq -i '.api.image = "ghcr.io/${{ github.repository_owner }}/northstar-api"' helm/northstar/values.yaml
        yq -i '.api.tag = "${{ github.sha }}"' helm/northstar/values.yaml

        yq -i '.worker.image = "ghcr.io/${{ github.repository_owner }}/northstar-worker"' helm/northstar/values.yaml
        yq -i '.worker.tag = "${{ github.sha }}"' helm/northstar/values.yaml

        yq -i '.frontend.image = "ghcr.io/${{ github.repository_owner }}/northstar-frontend"' helm/northstar/values.yaml
        yq -i '.frontend.tag = "${{ github.sha }}"' helm/northstar/values.yaml

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add helm/northstar/values.yaml
        git commit -m "chore: bump image tags to ${{ github.sha }} [skip ci]" || echo "No changes to commit"
        git push