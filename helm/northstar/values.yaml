namespace: northstar

api:
  image: northstar-order-platform-order-api
  tag: "latest"
  pullPolicy: IfNotPresent
  replicas: 2

frontend:
  image: northstar-order-platform-frontend
  tag: "latest"
  pullPolicy: IfNotPresent
  replicas: 2

worker:
  image: northstar-order-platform-worker
  tag: "latest"
  pullPolicy: IfNotPresent
  replicas: 2

postgres:
  image: postgres
  tag: "17-alpine"
  user: app
  password: app
  dbName: orders
  storageSize: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 65

ingress:
  host: orders.local
  className: nginx
  local: true