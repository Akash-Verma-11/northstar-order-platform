apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "northstar.fullname" . }}-worker
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector: {matchLabels: {app: northstar-worker}}
  template:
    metadata: {labels: {app: northstar-worker}}
    spec:
      containers:
      - name: worker
        image: "{{ .Values.worker.image }}:{{ .Values.worker.tag }}"
        imagePullPolicy: {{ .Values.worker.pullPolicy }}
        env:
        - {name: DB_USER, value: {{ .Values.postgres.user | quote }}}
        - {name: DB_NAME, value: {{ .Values.postgres.dbName | quote }}}
        - {name: DB_HOST, value: {{ .Values.postgres.host | default "postgres" | quote }}}
        - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: order-db-secret, key: password}}}
        - {name: DATABASE_URL, value: "postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):5432/$(DB_NAME)"}
        livenessProbe:
          exec: {command: ["pgrep", "-f", "worker.py"]}
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 250m, memory: 256Mi}}
