#for local

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: northstar
  namespace: northstar
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: orders.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: frontend, port: {number: 80}}}