apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-access
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels: {app: postgres}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: {matchLabels: {app: northstar-api}}
    - podSelector: {matchLabels: {app: northstar-worker}}
    ports:
    - protocol: TCP
      port: 5432