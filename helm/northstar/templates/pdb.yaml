{{- if .Values.frontend.enabled | default true }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "northstar.fullname" . }}-frontend
  namespace: {{ .Values.namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: northstar-frontend
---
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "northstar.fullname" . }}-api
  namespace: {{ .Values.namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: northstar-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "northstar.fullname" . }}-worker
  namespace: {{ .Values.namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: northstar-worker
