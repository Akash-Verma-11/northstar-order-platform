apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ include "northstar.fullname" . }}-api}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector: {matchLabels: {app: northstar-api}}
  template:
    metadata: {labels: {app: northstar-api}}
    spec:
      containers:
      - name: api
        image: "{{ .Values.api.image }}:{{ .Values.api.tag }}"
        ports: [{containerPort: 8080}]
        env:
        - {name: DATABASE_URL, value: "postgresql+psycopg://app:app@postgres:5432/orders"}
        startupProbe:
          httpGet: {path: /api/health, port: 8080}
          periodSeconds: 5
          failureThreshold: 30      # up to 150s to boot
        readinessProbe:
          httpGet: {path: /api/ready, port: 8080}
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet: {path: /api/health, port: 8080}
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 4
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata: {name: northstar-api}
spec:
  selector: {app: northstar-api}
  ports: [{port: 8080, targetPort: 8080}]
