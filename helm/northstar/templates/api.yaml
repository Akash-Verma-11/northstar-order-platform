apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "northstar.fullname" . }}-api
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.api.replicas }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: northstar-api}}
  template:
    metadata:
      labels: {app: northstar-api}
      annotations: {prometheus.io/scrape: "true", prometheus.io/path: "/metrics", prometheus.io/port: "8080"}
    spec:
      containers:
      - name: api
        image: "{{ .Values.api.image }}:{{ .Values.api.tag }}"
        imagePullPolicy: {{ .Values.api.pullPolicy }}
        ports: [{containerPort: 8080}]
        env:
        - {name: DB_USER, value: {{ .Values.postgres.user | quote }}}
        - {name: DB_NAME, value: {{ .Values.postgres.dbName | quote }}}
        - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: order-db-secret, key: password}}}
        - {name: DATABASE_URL, value: "postgresql+psycopg://$(DB_USER):$(DB_PASSWORD)@postgres:5432/$(DB_NAME)"}
        startupProbe:
          httpGet: {path: /api/health, port: 8080}
          failureThreshold: 30
          periodSeconds: 5
        readinessProbe:
          httpGet: {path: /api/ready, port: 8080}
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet: {path: /api/health, port: 8080}
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 4
        resources: {requests: {cpu: 200m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: order-api
  namespace: {{ .Values.namespace }}
  labels: {app: order-api}
spec:
  selector: {app: northstar-api}
  ports: [{name: http, port: 8080, targetPort: 8080}]